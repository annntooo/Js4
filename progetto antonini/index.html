<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="bg-warning text-center">
        <p class="titolo">SCRIPT JAVASCRIPT</p>
        <p class="sottoTitolo">Una collezione di script Javascript</p>
    </div>

    <div class=" container text-center bordi contenitore">
        <div class="row my-5 text-center ">
            <div class="col-sm-4 border border-warning ">
                <h3>COSA FA LO SCRIPT</h3>
                <img class="d-sm-block d-none" src="./images/js.webp">
                <p class="bg-primary text-light ">inserisci un numero e lo script calcolerà i divisori </p>
            </div>
            <div class="col-6 col-sm-4 border border-warning">
                <h3>IL TUO INPUT</h3>
                <form>
                    <input type="number" id="input" class="w-75">
                    <button onclick="divisore(), caricamento()" type="button">Calcola</button>
                </form>
            </div>
            <div class="col-6 col-sm-4 border border-warning">
                <h3>RISULTATO </h3>
                <div id="c" class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>


                <p id="risultato"></p>
                <p id="divisori"></p>
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/scrpt.js"></script>
</body>

</html>
